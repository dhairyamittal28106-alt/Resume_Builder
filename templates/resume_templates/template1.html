<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ resume.title }}</title>
  <style>
    body {
      font-family: Arial;
      background: #ffffff;
      padding: 40px;
      color: #111827;
    }
    h1 {
      margin-bottom: 5px;
    }
    h2 {
      margin-top: 30px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }
    p {
      line-height: 1.6;
    }
  </style>
</head>
<body>

<h1>{{ resume.title }}</h1>
<p>{{ resume.job_role }}</p>

<h2>Skills</h2>
<p>{{ resume.skills }}</p>

<h2>Education</h2>
<p>{{ resume.education }}</p>

<h2>Experience</h2>
<p>{{ resume.experience }}</p>

<h2>ATS Score</h2>
<p>{{ score }}/100</p>

</body>
</html>
